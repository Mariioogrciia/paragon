name: Build iOS IPA (KMP)

# Prueba de Compose Multiplatform: kmp/shared (Kotlin) + kmp/iosApp (host Swift).
# Solo a mano o al tocar kmp/: los minutos de macOS cuentan x10.
on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - "kmp/**"
      - ".github/workflows/build-ios-kmp.yml"

jobs:
  build:
    name: IPA sin firmar para Sideloadly
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Caché de Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('kmp/**/*.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Generar iosApp.xcodeproj (XcodeGen)
        working-directory: kmp/iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar la app
        working-directory: kmp/iosApp
        run: |
          set -o pipefail
          xcodebuild -project iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath "$RUNNER_TEMP/dd" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" 2>&1 | tee "$RUNNER_TEMP/xcode.log"

      # Los logs de Actions piden sesión; las anotaciones no. Así los errores de
      # Kotlin/Swift se pueden leer por la API sin estar logueado.
      - name: Publicar los errores de compilación
        if: failure()
        run: |
          grep -E "^e: |error:|: error" "$RUNNER_TEMP/xcode.log" | grep -v "^warning" | sort -u | head -150 > "$RUNNER_TEMP/errores.txt" || true
          head -10 "$RUNNER_TEMP/errores.txt" | while IFS= read -r l; do echo "::error::${l}"; done
          todo=$(sed -e "s/%/%25/g" "$RUNNER_TEMP/errores.txt" | awk 1 ORS="%0A")
          echo "::error title=Todos los errores::${todo}"

      # Diagnóstico de Siri: sin Metadata.appintents, iOS no conoce los Atajos.
      - name: Revisar App Intents empaquetados
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Paragon.app"
          plutil -p "$APP/Info.plist"
          ls "$APP" | grep -iE "AppIcon|Assets.car" || echo "::warning::La app no lleva icono"
          if [ -d "$APP/Metadata.appintents" ]; then
            ls -la "$APP/Metadata.appintents"
            for f in "$APP/Metadata.appintents"/*.actionsdata; do
              echo "== $f"
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k: d[k] for k in d if k in ("actions","autoShortcuts","autoShortcutProviderMangledName","version")}, ensure_ascii=False)[:4000])' "$f" || head -c 4000 "$f"
            done
          else
            echo "::warning::No hay Metadata.appintents en la app: Siri no verá los Atajos"
          fi

      - name: Empaquetar IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Paragon.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry paragon-kmp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: paragon-kmp-ipa
          path: ${{ runner.temp }}/ipa/paragon-kmp.ipa

      # Para pasar a ios-builder (espera el .xcodeproj commiteado).
      - uses: actions/upload-artifact@v4
        with:
          name: iosApp-xcodeproj
          path: kmp/iosApp/iosApp.xcodeproj
