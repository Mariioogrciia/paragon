name: Build Android APK (KMP)

# La APK de la app de kmp/ (Android), para instalar a mano en el móvil. Se
# compila al tocar kmp/ en cualquier rama (y a mano): en Linux los minutos no
# cuentan x10 como en macOS. Sale sin firmar con clave propia (la de debug).
on:
  workflow_dispatch:
  push:
    paths:
      - "kmp/**"
      - ".github/workflows/build-android-kmp.yml"

jobs:
  build:
    name: APK de debug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Los tests de la app (kmp/shared/src/commonTest) antes de la APK: si
      # alguno falla, no sale APK. Hasta el 13 oct 2026 existían pero nadie
      # los ejecutaba. Mismo Gradle para los dos: se configura una sola vez.
      - name: Tests de la app y APK
        working-directory: kmp
        run: ./gradlew --no-daemon :shared:testAndroidHostTest :androidApp:assembleDebug

      - name: Informe de los tests (si fallan)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-tests-app
          path: kmp/shared/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: paragon-kmp-apk
          path: kmp/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
