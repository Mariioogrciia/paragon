name: Sincronización frecuente de trofeos

# El plan Hobby de Vercel solo deja 1 ejecución diaria de un cron propio
# (ver el comentario en src/app/api/cron/sync/route.ts — ya se probó por
# horas y Vercel rechazó el despliegue). Esto llama a esa MISMA ruta, desde
# fuera de Vercel, cada 30 minutos — la ruta no distingue quién la llama,
# solo exige la cabecera Authorization correcta (mismo CRON_SECRET de
# siempre), así que no hace falta tocar nada del código ni del plan.
#
# Configuración necesaria en GitHub (Settings → Secrets and variables →
# Actions), una sola vez:
#   - Secret  SITE_URL:     https://tu-dominio-real (sin barra al final)
#   - Secret  CRON_SECRET:  el mismo valor exacto que ya tiene Vercel
#     (Vercel → Project → Settings → Environment Variables → CRON_SECRET)
#
# El cron diario de vercel.json se deja tal cual, como red de seguridad si
# este workflow fallara alguna vez — los dos llaman a la misma ruta
# idempotente, no hay problema en que se pisen.
on:
  schedule:
    # GitHub no garantiza el minuto exacto bajo carga de la plataforma —
    # puede llegar con algunos minutos de retraso en horas punta, es una
    # limitación conocida de los cron de GitHub Actions, no de este repo.
    # Cada 4 h (antes 30 min, y antes 10): el 10 nov 2026 Vercel avisó de que
    # el plan gratis iba al 115 % de su CPU activa (4 h al mes) y de que
    # pausaría la cuenta. Esta ruta era lo único que corría solo, 48 veces al
    # día, hasta 22 s cada vez. Abrir la app o la web ya sincroniza al
    # momento, así que esto solo cubre a quien no entra en días.
    - cron: "17 */4 * * *"
    # Foto semanal de las ligas (lo que hacía el cron de vercel.json de los
    # lunes, 10 nov 2026: en Cloud Run no hay crons de Vercel).
    - cron: "7 4 * * 1"
  workflow_dispatch: {} # Para poder lanzarlo a mano desde la pestaña Actions, sin esperar al reloj.

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/cron/sync
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "Faltan los secrets SITE_URL y/o CRON_SECRET en este repo (Settings → Secrets and variables → Actions)."
            exit 1
          fi

          ruta=/api/cron/sync
          if [ "${{ github.event.schedule }}" = "7 4 * * 1" ]; then ruta=/api/cron/league-snapshot; fi
          echo "Llamando a $ruta"

          respuesta=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}$ruta")

          echo "HTTP $respuesta"
          cat /tmp/resp.json

          if [ "$respuesta" -ge 300 ]; then
            exit 1
          fi
