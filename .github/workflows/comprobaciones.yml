name: Comprobaciones

# Typecheck, lint y tests en cada push a master y en cada PR. No bloquea el
# despliegue de Vercel (va por su lado), pero avisa por correo de GitHub si
# algo se rompe — antes no había ninguna comprobación automática.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npx eslint src
      - name: Tests
        run: npm test
      # Cada useTranslations del cliente tiene que existir en messages/ y en
      # NAMESPACES_CLIENTE; si no, la web enseña la clave en vez del texto
      # (pasó el 6 oct con "PerfilPage.amistad.enviada").
      - name: Textos de la web (namespaces)
        run: npx tsx scripts/textos-por-ruta.mts --comprobar
      # Textos de la app (21 oct 2026): cada idioma con los mismos huecos {0}
      # que el español, y lo generado al día con kmp/i18n/textos.json.
      - name: Textos de la app (huecos y generado)
        run: |
          node kmp/i18n/generar.mjs
          git diff --exit-code -- kmp/shared/src/commonMain/kotlin/com/paragon/shared/i18n kmp/androidApp/src/main/res
