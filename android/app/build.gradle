apply plugin: 'com.android.application'
// Sin esto, Gradle ignora silenciosamente todo `.kt` bajo src/main/java (los
// .kt de Compose y de red que añade esta sesión y Gemini en paralelo) — el
// build "compila" pero ComposeMainActivity no existe de verdad y la app
// revienta con ClassNotFoundException al lanzar, no al construir.
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.paragon.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.paragon.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.10"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Kotlin & Jetpack Compose
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.navigation:navigation-compose:2.7.7"
    
    // Using an older compose BOM to ensure compatibility with Kotlin 1.9.22
    def composeBom = platform("androidx.compose:compose-bom:2024.02.00")
    implementation composeBom
    androidTestImplementation composeBom
    
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    // Solo el core (Home, List, Person...) se queda corto para distinguir
    // pestañas nuevas como Estadísticas o Carpetas de un vistazo — con esto
    // sacamos iconos temáticos de verdad (BarChart, Groups, EmojiEvents...)
    // en vez de forzar el core a hacer de todo.
    implementation "androidx.compose.material:material-icons-extended"
    debugImplementation "androidx.compose.ui:ui-tooling"
    
    // Image Loading (Coil for Compose)
    implementation("io.coil-kt.coil3:coil-compose:3.0.0-rc01")
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.0.0-rc01")
    
    // Networking
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-moshi:2.11.0"
    // Adaptador Kotlin de Moshi por reflexión — evita meter kapt solo para
    // dos data class de respuesta (ver ApiClient.kt/PanelApi.kt).
    implementation "com.squareup.moshi:moshi-kotlin:1.15.1"

    // Custom Tabs para el login (Google/Discord viven en la web, no hay
    // contraseña que pedir dentro de la app) — ver ComposeMainActivity.kt.
    implementation "androidx.browser:browser:$androidxBrowserVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
