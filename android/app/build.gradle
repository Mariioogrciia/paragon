apply plugin: 'com.android.application'
// Sin esto, Gradle ignora silenciosamente todo `.kt` bajo src/main/java (los
// .kt de Compose y de red que añade esta sesión y Gemini en paralelo) — el
// build "compila" pero ComposeMainActivity no existe de verdad y la app
// revienta con ClassNotFoundException al lanzar, no al construir.
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace = "com.paragon.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.paragon.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
    }
    // Con Kotlin 2.0+ el compilador de Compose lo fija el plugin
    // 'org.jetbrains.kotlin.plugin.compose' (misma versión que kotlinVersion,
    // aplicado arriba) — composeOptions.kotlinCompilerExtensionVersion ya no
    // se usa y su presencia con Kotlin 2.0 da error de configuración.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Kotlin & Jetpack Compose
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation "androidx.navigation:navigation-compose:2.8.3"

    // Subido desde 2024.02.00 (con Kotlin 1.9.22) para tener
    // SharedTransitionLayout (transición de carátula compartida entre
    // Biblioteca y Ficha de juego) — necesita animation/foundation 1.7.0+,
    // que no existía en el BOM anterior.
    def composeBom = platform("androidx.compose:compose-bom:2024.10.01")
    implementation composeBom
    androidTestImplementation composeBom
    
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    // Solo el core (Home, List, Person...) se queda corto para distinguir
    // pestañas nuevas como Estadísticas o Carpetas de un vistazo — con esto
    // sacamos iconos temáticos de verdad (BarChart, Groups, EmojiEvents...)
    // en vez de forzar el core a hacer de todo.
    implementation "androidx.compose.material:material-icons-extended"
    debugImplementation "androidx.compose.ui:ui-tooling"
    
    // Image Loading & Colors
    implementation("io.coil-kt.coil3:coil-compose:3.0.0-rc01")
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.0.0-rc01")
    implementation("androidx.palette:palette-ktx:1.0.0")

    // Widgets (Glance)
    implementation("androidx.glance:glance-appwidget:1.1.0")

    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    
    // Networking
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-moshi:2.11.0"
    // Adaptador Kotlin de Moshi por reflexión — evita meter kapt solo para
    // dos data class de respuesta (ver ApiClient.kt/PanelApi.kt).
    implementation "com.squareup.moshi:moshi-kotlin:1.15.1"

    // Custom Tabs para el login (Google/Discord viven en la web, no hay
    // contraseña que pedir dentro de la app) — ver ComposeMainActivity.kt.
    implementation "androidx.browser:browser:$androidxBrowserVersion"

    // Notificaciones push nativas (FCM) — ver push/ParagonFirebaseMessagingService.kt.
    // El BOM fija la versión de firebase-messaging; funciona en tiempo de
    // compilación aunque todavía no exista google-services.json (el plugin
    // de más abajo es lo único condicionado a ese archivo — sin él, Firebase
    // simplemente no se inicializa en tiempo de ejecución).
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
