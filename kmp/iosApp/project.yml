# XcodeGen: la CI genera iosApp.xcodeproj a partir de este archivo (sin Mac
# no hay Xcode para crearlo a mano). Para pasar a ios-builder, que espera el
# .xcodeproj ya en el repo, basta con commitear el que sube la CI como artefacto.
name: iosApp
options:
  bundleIdPrefix: com.paragon
  # Las frases de Siri (Atajos.swift) están en español.
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Paragon
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.paragon.app.kmp
        # Escrito a mano (no generado): lleva el nombre y el icono que Siri necesita.
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        # La fase de Gradle escribe fuera del proyecto de Xcode.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compilar Kotlin (Shared.framework)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          chmod +x ./gradlew
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
