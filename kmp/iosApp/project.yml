# XcodeGen: la CI genera iosApp.xcodeproj a partir de este archivo (sin Mac
# no hay Xcode para crearlo a mano). Para pasar a ios-builder, que espera el
# .xcodeproj ya en el repo, basta con commitear el que sube la CI como artefacto.
name: iosApp
options:
  bundleIdPrefix: com.paragon
  # Las frases de Siri (Atajos.swift) están en español.
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Paragon
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.paragon.app.kmp
        # Escrito a mano (no generado): lleva el nombre y el icono que Siri necesita.
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Iconos a elegir en Ajustes → Apariencia → Icono (kmp/iconos/generar.py).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Oro AppIcon-Claro AppIcon-Neon AppIcon-Esmeralda"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # La versión que ve la gente; el número de build lo pone la CI al publicar.
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Shared"]
        # La fase de Gradle escribe fuera del proyecto de Xcode.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Push (APNs) y el App Group del widget. Sin firmar (Sideloadly) no se aplican.
        CODE_SIGN_ENTITLEMENTS: iosApp/Paragon.entitlements
    dependencies:
      # El widget de la pantalla de inicio (va dentro de Paragon.app/PlugIns).
      - target: ParagonWidget
    preBuildScripts:
      - name: Compilar Kotlin (Shared.framework)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          chmod +x ./gradlew
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  ParagonWidget:
    type: app-extension
    platform: iOS
    sources:
      - ParagonWidget
    settings:
      base:
        PRODUCT_NAME: ParagonWidget
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.paragon.app.kmp.widget
        INFOPLIST_FILE: ParagonWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ParagonWidget/ParagonWidget.entitlements
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
