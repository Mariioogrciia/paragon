# 5 GB de tope (5 oct 2026): con 3 GB, Kotlin/Native se quedaba sin memoria
# compilando la app de iOS en la CI ("Java heap space"). Es un máximo, no se
# reserva: en Windows no cambia nada si no hace falta.
org.gradle.jvmargs=-Xmx5g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.code.style=official
# En Windows los targets de iOS no se pueden compilar (necesitan macOS): que
# no avise en cada build. Allí se comprueba compilando el target Android.
kotlin.native.ignoreDisabledTargets=true
# Permite llamar a funciones suspend de Kotlin desde cualquier hilo de Swift
# (los App Intents de Siri no corren en el principal).
kotlin.native.binary.objcExportSuspendFunctionLaunchThreadRestriction=none
android.useAndroidX=true
